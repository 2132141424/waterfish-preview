<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>华容道 — 曹操出逃</title>
<meta name="theme-color" content="#0a0a1a" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;color:#c0c8ff;overflow:hidden}
h1{margin-top:14px;font-size:20px;letter-spacing:.05em}
#hud{display:flex;gap:20px;margin:8px 0 10px;font-size:14px}
#hud b{color:#ffd65a}
#frame{position:relative;width:min(88vw,400px);height:calc(min(88vw,400px)*1.25);background:#1a1a40;border:3px solid #3030a0;border-radius:8px;box-shadow:0 0 26px rgba(48,48,160,.35)}
#exit{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:50%;height:13px;background:#ffd65a;border-radius:6px 6px 0 0}
#board{position:absolute;inset:4px;display:grid}
.piece{position:absolute;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;cursor:grab;transition:left .14s,top .14s;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.piece:active{cursor:grabbing}
.piece.aa{background:linear-gradient(135deg,#a33,#d55);color:#fff}
.piece.g{background:linear-gradient(135deg,#3a6a3a,#4a9040);color:#eaffd8}
.piece.v,.piece.h{background:linear-gradient(135deg,#3a4ab0,#4a5ae0);color:#dce0ff}
.piece.b{background:linear-gradient(135deg,#c9972a,#e0b050);color:#3a2a00}
.controls{margin-top:12px;display:flex;gap:10px}
button{padding:8px 20px;border-radius:20px;background:#3030a0;border:none;color:#c0c8ff;font-size:13px;cursor:pointer}
button:hover{background:#4444c0}
#winMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(3,3,15,.9);border-radius:8px;z-index:5}
#winMsg h2{font-size:26px;color:#ffd65a}
footer{font-size:11px;color:#1a1a40;padding:8px}
</style>
</head>
<body>
<h1>华容道</h1>
<div id="hud">步数 <b id="steps">0</b>｜目标：让<b>曹操</b>从上方出口逃出</div>
<div id="frame">
  <div id="exit"></div>
  <div id="board"></div>
  <div id="winMsg"><h2>🎉 曹操出逃成功！</h2><button id="again">再来一局</button></div>
</div>
<div class="controls"><button id="reset">重置</button><button id="hint">提示</button></div>
<footer>经典滑块谜题 · 同屏可拖动，也可点击目标空白格移动</footer>
<script>
"use strict";
const COLS=4,ROWS=5;
// piece: {name, r, c, w(1/2), h(1/2), type}
const START=[
  {name:'曹操',r:0,c:1,w:2,h:2,type:'aa'},
  {name:'张飞',r:0,c:0,w:1,h:2,type:'v'},
  {name:'赵云',r:0,c:3,w:1,h:2,type:'v'},
  {name:'马超',r:2,c:0,w:1,h:2,type:'v'},
  {name:'黄忠',r:2,c:3,w:1,h:2,type:'v'},
  {name:'关羽',r:3,c:1,w:2,h:1,type:'h'},
  {name:'兵1',r:3,c:0,w:1,h:1,type:'b'},
  {name:'兵2',r:3,c:2,w:1,h:1,type:'b'},
  {name:'兵3',r:4,c:1,w:1,h:1,type:'b'},
  {name:'兵4',r:4,c:2,w:1,h:1,type:'b'},
];
let pieces,selected=null,steps=0,won=false;
const boardEl=document.getElementById('board');
const stepsEl=document.getElementById('steps'),winMsg=document.getElementById('winMsg');
let cellPx;
function layout(){const r=boardEl.getBoundingClientRect();cellPx=r.width/COLS;}
function rebuild(){
  pieces=START.map(p=>({...p}));selected=null;render();
}
function grid(){
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  pieces.forEach((p,i)=>{for(let rr=p.r;rr<p.r+p.h;rr++)for(let cc=p.c;cc<p.c+p.w;cc++)g[rr][cc]=i;});
  return g;
}
function canMove(p,dr,dc){
  const g=grid();
  const nr=p.r+dr,nc=p.c+dc;
  if(nr<0||nc<0||nr+p.h>ROWS||nc+p.w>COLS)return false;
  for(let rr=nr;rr<nr+p.h;rr++)for(let cc=nc;cc<nc+p.w;cc++)if(g[rr][cc]!==null)return false;
  return true;
}
// try sliding a piece as far as possible in a direction by clicking an empty cell
function movePiece(p,dr,dc){
  let moved=false;
  while(canMove(p,dr,dc)){p.r+=dr;p.c+=dc;moved=true;steps++;}
  if(moved){stepsEl.textContent=steps;render();checkWin();}
  return moved;
}
function selectAt(r,c){
  const g=grid(),idx=g[r][c];
  if(idx===null){ if(selected)selected=null; render(); return; }
  selected=idx;render();
}
// click handler: if clicked own piece -> select; else try move selected toward it (if aligned)
function onCell(r,c){
  if(won)return;
  const g=grid(),idx=g[r][c];
  if(idx!==null){selectAt(r,c);return;}
  if(selected===null)return;
  const p=pieces[selected];
  // vertical alignment
  if(c>=p.c&&c<p.c+p.w){
    if(r<p.r)movePiece(p,-1,0);else if(r>=p.r+p.h)movePiece(p,1,0);
  }else if(r>=p.r&&r<p.r+p.h){
    if(c<p.c)movePiece(p,0,-1);else if(c>=p.c+p.w)movePiece(p,0,1);
  }
  selectAt(r,c);
}
function drag(e){
  const rect=boardEl.getBoundingClientRect();layout();
  const r=Math.max(0,Math.min(ROWS-1,Math.floor((e.clientY-rect.top-4)/(boardEl.clientHeight-8)*ROWS)));
  const c=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-rect.left-4)/(boardEl.clientWidth-8)*COLS)));
  onCell(r,c);
}
function checkWin(){
  const p=pieces.find(x=>x.type==='aa');
  if(p&&p.r===0){won=true;winMsg.style.display='flex';}
}
function render(){
  layout();boardEl.innerHTML='';
  const pad=4,gap=3;
  const unit=(boardEl.clientWidth-pad*2-gap*3)/4;
  boardEl.style.height=(boardEl.clientHeight)+'px';
  pieces.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='piece '+(p.type==='aa'?'aa':p.type==='h'?'h':p.type==='v'?'v':'b');
    el.style.left=(pad+p.c*(unit+gap))+'px';
    el.style.top=(pad+p.r*(unit+gap))+'px';
    el.style.width=(p.w*unit+(p.w-1)*gap)+'px';
    el.style.height=(p.h*unit+(p.h-1)*gap)+'px';
    el.style.fontSize=(p.type==='b'?12:p.w===2&&p.h===2?20:15)+'px';
    el.textContent=p.name;
    if(p.type==='v')el.style.flexDirection='column';
    if(selected===i)el.style.outline='3px solid #ffd65a';
    el.addEventListener('mousedown',e=>{e.preventDefault();selectAt(p.r,p.c);});
    el.addEventListener('click',e=>{e.stopPropagation();onCell(p.r,p.c);});
    boardEl.appendChild(el);
  });
  boardEl.addEventListener('mousemove',e=>{
    if(selected===null)return;
    const rect=boardEl.getBoundingClientRect();
    const ci=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-rect.left-pad)/unit)));
    const ri=Math.max(0,Math.min(ROWS-1,Math.floor((e.clientY-rect.top-pad)/unit)));
    void ci;void ri;
  });
}
boardEl.addEventListener('click',e=>{
  const rect=boardEl.getBoundingClientRect();
  layout();
  const r=Math.floor((e.clientY-rect.top-4)/(boardEl.clientHeight-8)*ROWS);
  const c=Math.floor((e.clientX-rect.left-4)/(boardEl.clientWidth-8)*COLS);
  if(r>=0&&r<ROWS&&c>=0&&c<COLS)onCell(Math.min(ROWS-1,r),Math.min(COLS-1,c));
});
document.getElementById('reset').addEventListener('click',()=>{steps=0;won=false;winMsg.style.display='none';stepsEl.textContent=0;rebuild();});
document.getElementById('again').addEventListener('click',()=>{resetAll();});
function resetAll(){steps=0;won=false;winMsg.style.display='none';stepsEl.textContent=0;rebuild();}
document.getElementById('hint').addEventListener('click',()=>{
  // simple hint: find 曹操 and move it if possible, else pick a random movable piece
  const aa=pieces.find(x=>x.type==='aa');
  if(canMove(aa,-1,0)){movePiece(aa,-1,0);return;}
  for(const p of pieces){if(p!==aa&&(canMove(p,-1,0))){movePiece(p,-1,0);return;}}
  for(const p of pieces){if(p!==aa&&canMove(p,0,-1)){movePiece(p,0,-1);return;}}
});
function init(){rebuild();}
init();
</script>
</body>
</html>
