<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>推箱子 — Sokoban</title>
<meta name="theme-color" content="#0a0a1a" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;color:#c0c8ff;overflow:hidden}
h1{margin-top:14px;font-size:20px;letter-spacing:.05em}
#hud{display:flex;gap:22px;margin:8px 0 10px;font-size:14px}
#hud b{color:#ffd65a}
#frame{background:#181832;padding:8px;border-radius:10px;border:1px solid #2a2a60;box-shadow:0 0 26px rgba(48,48,160,.35)}
#grid{display:grid}
.cell{width:24px;height:24px;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.wall{background:#3a3a70;border-radius:2px;color:transparent}
.floor{background:#101024}
.goal{background:#14143c}
.goal::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,214,90,.7)}
.box{background:linear-gradient(135deg,#8a5a2a,#b0803a);color:#201500;border-radius:3px;font-weight:700}
.box.on{background:linear-gradient(135deg,#3a8a5a,#4ab07a);color:#003300}
.player{color:#5ad0e0;font-weight:800}
.player.on{color:#5ae0a0}
.controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{padding:6px 16px;border-radius:16px;background:#3030a0;border:none;color:#c0c8ff;font-size:12px;cursor:pointer}
button:hover{background:#4444c0}
button.primary{background:linear-gradient(135deg,#6a4ae0,#9a5ae0);font-size:13px;padding:8px 24px;border-radius:20px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);gap:4px;margin-top:10px}
.dpad button{height:40px;font-size:18px;padding:0}
#status{min-height:20px;margin-top:10px;font-size:14px}
#status.win{color:#5ae0a0}
footer{font-size:11px;color:#1a1a40;padding:10px}
</style>
</head>
<body>
<h1>推箱子</h1>
<div id="hud">关卡 <b id="level">1</b>/<span id="total"></span>｜步数 <b id="moves">0</b></div>
<div id="frame"><div id="grid"></div></div>
<div id="status"></div>
<div class="controls">
  <button id="undo">↩ 撤销</button>
  <button id="reset">重置关卡</button>
  <button id="prev">上一关</button>
  <button class="primary" id="next">下一关 ▶</button>
</div>
<div class="dpad">
  <button data-d="up">↑</button>
  <button data-d="left">←</button>
  <button data-d="down">↓</button>
  <button data-d="right">→</button>
</div>
<footer>方向键/按钮移动，把箱子推到所有 ⭐ 目标点上 · WASD 同样支持</footer>
<script>
"use strict";
const LEVELS=[
"#####\n# . #\n# $ #\n# @ #\n#####",
"#######\n#  .  #\n#  $  #\n#  .  #\n#  $  #\n#  @  #\n#######",
"########\n#  .   #\n#  $   #\n#   .  #\n#   $  #\n#    @ #\n########"
];
let level=0,moves=0,grid=[],pr=0,pc=0,goals=[],boxes=[],history=[],won=false;
const gridEl=document.getElementById('grid');
const levelEl=document.getElementById('level'),totalEl=document.getElementById('total'),movesEl=document.getElementById('moves'),statusEl=document.getElementById('status');
totalEl.textContent=LEVELS.length;
function load(l){
  level=l;moves=0;history=[];won=false;
  const rows=LEVELS[l].split('\n');
  grid=rows.map(r=>r.split(''));
  goals=[];boxes=[];
  for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){
    const ch=grid[r][c];
    if(ch==='@'){pr=r;pc=c;grid[r][c]=' ';}
    else if(ch==='+'){pr=r;pc=c;goals.push([r,c]);grid[r][c]='.';}
    else if(ch==='.'){goals.push([r,c]);}
    else if(ch==='$'){boxes.push([r,c]);grid[r][c]=' ';}
    else if(ch==='*'){boxes.push([r,c]);goals.push([r,c]);grid[r][c]='.';}
  }
  levelEl.textContent=level+1;movesEl.textContent=0;statusEl.textContent='';statusEl.className='';
  render();
}
function at(r,c){return grid[r]&&grid[r][c]==='#';}
function isBox(r,c){return boxes.some(b=>b[0]===r&&b[1]===c);}
function boxIdx(r,c){return boxes.findIndex(b=>b[0]===r&&b[1]===c);}
function isGoal(r,c){return goals.some(g=>g[0]===r&&g[1]===c);}
function move(dr,dc){
  if(won)return;
  const nr=pr+dr,nc=pc+dc;
  if(at(nr,nc))return;
  if(isBox(nr,nc)){
    const bi=boxIdx(nr,nc);
    const nr2=nr+dr,nc2=nc+dc;
    if(at(nr2,nc2))return;
    if(isBox(nr2,nc2))return;
    history.push({pr,pc,box:bi,boxFrom:[nr,nc],boxTo:[nr2,nc2]});
    boxes[bi]=[nr2,nc2];pr=nr;pc=nc;moves++;
  }else{
    history.push({pr,pc,box:null});
    pr=nr;pc=nc;moves++;
  }
  movesEl.textContent=moves;
  checkWin();
  render();
}
function undo(){
  if(won||history.length===0)return;
  const h=history.pop();
  if(h.box!==null){boxes[h.box]=h.boxFrom;}
  pr=h.pr;pc=h.pc;
  moves--;movesEl.textContent=moves;
  render();
}
function checkWin(){if(boxes.every(b=>isGoal(b[0],b[1]))){won=true;statusEl.textContent='🎉 通关！';statusEl.className='win';}}
function render(){
  const rows=grid.length,cols=Math.max(...grid.map(r=>r.length));
  gridEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  gridEl.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    if(grid[r][c]==='#')cell.classList.add('wall');
    else{
      cell.classList.add(isGoal(r,c)?'goal':'floor');
      const bi=boxIdx(r,c);
      if(bi>=0){cell.classList.add('box');if(isGoal(r,c))cell.classList.add('on');cell.textContent='📦';}
    }
    if(r===pr&&c===pc){cell.classList.add('player'+(isGoal(r,c)?' on':''));cell.textContent='🧑';}
    gridEl.appendChild(cell);
  }
}
document.addEventListener('keydown',e=>{
  const map={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1],W:[-1,0],S:[1,0],A:[0,-1],D:[0,1]};
  const m=map[e.key];
  if(m)move(m[0],m[1]);
});
document.querySelectorAll('.dpad button').forEach(b=>b.addEventListener('click',()=>{
  const m={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[b.dataset.d];
  if(m)move(m[0],m[1]);
}));
document.getElementById('undo').addEventListener('click',undo);
document.getElementById('reset').addEventListener('click',()=>load(level));
document.getElementById('prev').addEventListener('click',()=>load(Math.max(0,level-1)));
document.getElementById('next').addEventListener('click',()=>{if(level<LEVELS.length-1)load(level+1);});
load(0);
</script>
</body>
</html>
