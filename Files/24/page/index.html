<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>记忆翻牌 — 连连看配对</title>
<meta name="theme-color" content="#0a0a1a" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;color:#c0c8ff;overflow:hidden}
h1{margin-top:14px;font-size:20px;letter-spacing:.05em}
#hud{display:flex;gap:24px;margin:8px 0 10px;font-size:14px}
#hud b{color:#ffd65a}
#opts{display:flex;gap:8px;margin-bottom:10px}
#opts button{padding:5px 14px;border-radius:16px;border:1px solid #2a2a60;background:transparent;color:#7a80c0;font-size:12px;cursor:pointer}
#opts button.active{background:#3030a0;color:#c0c8ff;border-color:#3030a0}
#grid{display:grid;gap:8px;width:min(92vw,460px)}
.card{aspect-ratio:1/1;background:linear-gradient(135deg,#242450,#30306a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,7vw,30px);cursor:pointer;border:1px solid #2a2a60;transition:transform .18s,background .18s;user-select:none}
.card.back::before{content:"?";font-weight:800;color:#5a5aa0}
.card.open,.card.done{background:linear-gradient(135deg,#3a3a90,#4848c0);transform:scale(1.02)}
.card.matched{background:linear-gradient(135deg,#2a6a40,#3a9050);border-color:#3a9050}
.card.matched::after{content:"✓";position:absolute;font-size:20px;color:#d8ffd8}
.card:hover{outline:2px solid #ffd65a;outline-offset:-2px}
#status{margin-top:12px;font-size:15px;min-height:22px}
#restart{margin-top:10px;padding:9px 26px;border-radius:22px;background:#3030a0;border:none;color:#c0c8ff;font-size:14px;cursor:pointer;display:none}
#restart:hover{background:#4444c0}
footer{font-size:11px;color:#1a1a40;padding:8px}
</style>
</head>
<body>
<h1>记忆翻牌</h1>
<div id="hud">配对 <b id="pairs">0/0</b>｜步数 <b id="moves">0</b></div>
<div id="opts">
  <button data-n="18">简单 3×4</button>
  <button data-n="20" class="active">普通 4×5</button>
  <button data-n="24">困难 4×6</button>
  <button data-n="36">炼狱 6×6</button>
</div>
<div id="grid"></div>
<div id="status"></div>
<button id="restart">再来一局</button>
<footer>翻开两张卡，找到相同的图案即可消除 · 锻炼记忆力</footer>
<script>
"use strict";
const EMOJIS=['🍎','🍊','🍇','🍓','🍒','🍍','🥝','🍉','🥥','🍑','🍋','🥭','🍅','🥑','🍆','🌽','🌸','☀️','🌙','⭐','🐱','🐶','🐼','🦊','🐸','🌊','⛵','🚀','🎈','🎵','⚽','🏀','🎯','🎲','🃏','💎'];
let sizes={18:{cols:4,n:18},20:{cols:5,n:20},24:{cols:6,n:24},36:{cols:6,n:36}};
let cards=[],moves=0,matched=0,openIdx=null,lock=false,size=20;
const gridEl=document.getElementById('grid');
const pairsEl=document.getElementById('pairs'),movesEl=document.getElementById('moves');
const statusEl=document.getElementById('status'),restartBtn=document.getElementById('restart');
document.querySelectorAll('#opts button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#opts button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');size=+b.dataset.n;start();
}));
function start(){
  const {cols,n}=sizes[size];
  const half=n/2;
  const pool=(()=>{const p=[];for(let i=0;p.length<half;i++)p.push(EMOJIS[i]);return p;})();
  const all=[];pool.forEach(e=>{all.push(e,e);});
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  cards=all.map((e,i)=>({e,i,state:'back'}));
  moves=0;matched=0;openIdx=null;lock=false;
  gridEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  gridEl.innerHTML='';
  cards.forEach((cd,i)=>{
    const el=document.createElement('div');
    el.className='card back';
    el.dataset.i=i;el.textContent=cd.e;
    el.addEventListener('click',()=>flip(i));
    gridEl.appendChild(el);
  });
  pairsEl.textContent='0/'+half;movesEl.textContent='0';
  statusEl.textContent='翻牌找配对！';restartBtn.style.display='none';
}
function el(i){return gridEl.querySelector(`[data-i="${i}"]`);}
function flip(i){
  if(lock)return;
  if(cards[i].state==='open'||cards[i].state==='matched')return;
  if(openIdx!==null&&openIdx===i)return;
  cards[i].state='open';el(i).classList.remove('back');el(i).classList.add('open');
  if(openIdx===null){openIdx=i;return;}
  // second card
  moves++;movesEl.textContent=moves;
  const j=openIdx;openIdx=null;lock=true;
  if(cards[i].e===cards[j].e){
    setTimeout(()=>{
      cards[i].state='matched';cards[j].state='matched';
      el(i).className='card matched';el(j).className='card matched';
      matched++;pairsEl.textContent=matched+'/'+(size/2);lock=false;
      if(matched===size/2){statusEl.textContent='🎉 全部配对完成！用了 '+moves+' 步';restartBtn.style.display='inline-block';}
    },350);
  }else{
    setTimeout(()=>{
      cards[i].state='back';cards[j].state='back';
      el(i).className='card back';el(j).className='card back';
      lock=false;
    },650);
  }
}
restartBtn.addEventListener('click',start);
start();
</script>
</body>
</html>
