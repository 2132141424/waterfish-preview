<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打砖块 — Breakout</title>
<meta name="theme-color" content="#0a0a1a" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;color:#c0c8ff;overflow:hidden;touch-action:none}
h1{margin-top:12px;font-size:20px;letter-spacing:.05em}
#hud{display:flex;gap:26px;margin:8px 0 6px;font-size:14px}
#hud b#score{color:#ffd65a}#hud b#lives{color:#5ae0a0}
canvas#g{display:block;background:#050512;border:1px solid #1a1a40;border-radius:6px;touch-action:none}
.controls{margin-top:10px}
#restart{padding:9px 26px;border-radius:22px;background:#3030a0;border:none;color:#c0c8ff;font-size:14px;cursor:pointer}
#restart:hover{background:#4444c0}
footer{font-size:11px;color:#1a1a40;padding:8px}
</style>
</head>
<body>
<h1>打砖块</h1>
<div id="hud">得分 <b id="score">0</b>｜生命 <b id="lives">3</b></div>
<canvas id="g" width="480" height="540"></canvas>
<div class="controls"><button id="restart">重新开始</button></div>
<footer>经典打砖块 · 鼠标/触摸控制挡板反弹小球击碎所有砖块</footer>
<script>
"use strict";
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
const BR={cols:8,rows:6,top:44,h:22,gap:4};
let score=0,lives=3,over=false,won=false,keys={};
const paddle={w:90,h:12,y:H-30};
const ball={r:6,x:W/2,y:H-52,vx:2.8,vy:-3.4,active:false};
let bricks=[];
const COLORS=['#e04a6a','#e07a4a','#e0b050','#7ae05a','#5ad0e0','#7a8ae0'];
function build(){
  bricks=[];
  const bw=(W-BR.gap*(BR.cols+1))/BR.cols;
  for(let r=0;r<BR.rows;r++)for(let c=0;c<BR.cols;c++)
    bricks.push({x:BR.gap+c*(bw+BR.gap),y:BR.top+r*(BR.h+BR.gap),w:bw,h:BR.h,c:COLORS[r%COLORS.length],hp:r<2?2:1});
}
function reset(){
  score=0;lives=3;over=false;won=false;
  paddle.x=W/2-paddle.w/2;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-paddle.r-1;
  ball.active=false;build();updateHud();
}
function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives;}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();const nx=(e.clientX-r.left)*(W/r.width);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,nx));if(!ball.active){ball.x=paddle.x;}});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const r=cv.getBoundingClientRect();const nx=(t.clientX-r.left)*(W/r.width);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,nx));if(!ball.active){ball.x=paddle.x;}},{passive:false});
cv.addEventListener('mousedown',()=>{if(over||won)return;if(!ball.active){ball.active=true;ball.vx=(Math.random()>.5?1:-1)*(2+Math.random()*1);ball.vy=-3.6;}});
cv.addEventListener('click',()=>{if(!ball.active&&!over&&!won)cv.dispatchEvent(new MouseEvent('mousedown'));});
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(){
  requestAnimationFrame(loop);
  if(!keys[' ']){/*space to launch*/}
  if(keys['arrowleft']||keys['a']){paddle.x-=7;}
  if(keys['arrowright']||keys['d']){paddle.x+=7;}
  paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));
  if(!ball.active){ball.x=paddle.x;ball.y=paddle.y-paddle.r-1;if(keys[' ']){ball.active=true;ball.vy=-3.6;}}
  else if(!over&&!won){step();}
  draw();
}
function step(){
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
  // paddle
  if(ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+12&&ball.x>=paddle.x-paddle.w/2&&ball.x<=paddle.x+paddle.w/2){
    const off=(ball.x-paddle.x)/(paddle.w/2);
    ball.vy=-Math.abs(ball.vy)-.1;
    ball.vx=off*5.5;
    ball.y=paddle.y-ball.r;
  }
  // bricks
  for(let i=bricks.length-1;i>=0;i--){
    const b=bricks[i];
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.hp--;
      if(ball.vy>0&&ball.y>paddle.y||true){ball.vy*=-1;}
      // more accurate reflection
      const overlapX=(ball.x-(b.x+b.w/2))>0? (ball.x-ball.r-(b.x+b.w)):(b.x-(ball.x+ball.r));
      const overlapY=(ball.y-(b.y+b.h/2))>0? (ball.y-ball.r-(b.y+b.h)):(b.y-(ball.y+ball.r));
      if(Math.abs(overlapX)>Math.abs(overlapY))ball.vx*=-1;else ball.vy*=-1;
      if(b.hp<=0){bricks.splice(i,1);score+=10*COLORS.indexOf(b.c)+10;}
      else score+=5;
      updateHud();
    }
  }
  if(bricks.length===0){won=true;return;}
  if(ball.y-ball.r>H){lives--;updateHud();if(lives<=0){over=true;}else{paddle.x=W/2-paddle.w/2;ball.x=paddle.x;ball.y=paddle.y-ball.r-1;ball.active=false;}}
}
function draw(){
  ctx.fillStyle='#050512';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a2a60';ctx.fillRect(0,0,W,8);
  for(const b of bricks){ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);}
  ctx.fillStyle='#5ad0e0';ctx.beginPath();ctx.roundRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,6);ctx.fill();
  ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  if(!ball.active){ctx.fillStyle='#7a80c0';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('点击开始 / 空格发射',W/2,H/2);}
  if(over){ctx.fillStyle='rgba(3,3,15,.84)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c0c8ff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('游戏结束',W/2,H/2-10);ctx.fillStyle='#ffd65a';ctx.font='16px sans-serif';ctx.fillText('得分 '+score,W/2,H/2+22);}
  if(won){ctx.fillStyle='rgba(3,3,15,.84)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5ae0a0';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('🎉 通关！',W/2,H/2-10);ctx.fillStyle='#ffd65a';ctx.font='16px sans-serif';ctx.fillText('得分 '+score,W/2,H/2+22);}
}
document.getElementById('restart').addEventListener('click',reset);
reset();loop();
</script>
</body>
</html>
