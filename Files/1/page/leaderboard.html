<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #faf8ef;
            background-image: linear-gradient(to bottom, #faf8ef 0%, #f2e8d5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #776e65;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
        }

        .leaderboard-container {
            background-color: #bbada0;
            background-image: linear-gradient(to bottom, #bbada0 0%, #a59380 100%);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            overflow-x: auto; /* 适配小屏幕横向滚动 */
        }

        /* 排行榜表头优化 */
        .leaderboard-header {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 150px;
            padding: 15px;
            background-color: #8f7a66;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 10px;
            min-width: 500px; /* 最小宽度确保列不挤压 */
        }

        /* 排行榜条目优化 */
        .leaderboard-item {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px 150px;
            padding: 15px;
            background-color: #cdc1b4;
            border-radius: 8px;
            margin-bottom: 10px;
            align-items: center;
            transition: all 0.2s ease;
            min-width: 500px;
        }

        .leaderboard-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            background-color: #d5c9bc;
        }

        /* 排名样式优化 */
        .rank {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            position: relative;
        }

        .rank-1 { 
            color: #edc22e; 
            font-size: 20px;
        }
        .rank-2 { color: #bbb; }
        .rank-3 { color: #f2b179; }

        /* 前三名添加特殊标记 */
        .rank-1::after {
            content: "🏆";
            position: absolute;
            top: -5px;
            right: 5px;
            font-size: 12px;
        }

        .name {
            font-size: 16px;
            padding: 0 10px;
        }

        .score {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }

        /* 最高数字特殊样式 */
        .highest-num {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            color: #edc22e;
        }

        .date {
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 18px;
        }

        .btn {
            padding: 12px 24px;
            background-color: #8f7a66;
            background-image: linear-gradient(to bottom, #8f7a66 0%, #776e65 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 4px 0 #635548;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #635548;
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #635548;
        }

        /* 响应式优化 */
        @media (max-width: 600px) {
            .leaderboard-header, .leaderboard-item {
                grid-template-columns: 50px 1fr 80px 80px 100px;
                padding: 12px 10px;
                min-width: 400px;
            }

            .rank, .score, .highest-num {
                font-size: 16px;
            }

            .rank-1 {
                font-size: 18px;
            }

            .name, .date {
                font-size: 14px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        /* 排行榜说明 */
        .leaderboard-tip {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">2048 排行榜</h1>
    </div>

    <div class="leaderboard-container" id="leaderboard-container">
        <div class="leaderboard-header">
            <div class="rank">排名</div>
            <div class="name">玩家</div>
            <div class="score">分数</div>
            <div class="highest-num">最高数字</div>
            <div class="date">时间</div>
        </div>
        <div id="leaderboard-list"></div>
    </div>

    <p class="leaderboard-tip">排行榜按分数降序排列，分数相同时按最高数字降序排列</p>
    
    <button id="back-to-game" class="btn">返回游戏</button>

    <script>
        // 加载排行榜数据
        function loadLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('2048-leaderboard')) || [];
            const listElement = document.getElementById('leaderboard-list');

            // 无数据时显示空状态
            if (leaderboard.length === 0) {
                listElement.innerHTML = '<div class="empty-state">暂无排行榜数据</div>';
                return;
            }

            // 渲染排行榜
            leaderboard.forEach((item, index) => {
                const itemElement = document.createElement('div');
                itemElement.className = 'leaderboard-item';
                // 补全最高数字字段（兼容旧数据）
                const highestNumber = item.highestNumber || 0;
                
                itemElement.innerHTML = `
                    <div class="rank rank-${index + 1}">${index + 1}</div>
                    <div class="name">${item.name}</div>
                    <div class="score">${item.score}</div>
                    <div class="highest-num">${highestNumber}</div>
                    <div class="date">${item.date}</div>
                `;
                listElement.appendChild(itemElement);
            });
        }

        // 绑定返回按钮事件
        document.getElementById('back-to-game').addEventListener('click', () => {
            window.location.href = 'index.html'; // 请确保主游戏页面文件名正确
        });

        // 页面加载时加载数据
        window.addEventListener('load', loadLeaderboard);
    </script>
</body>
</html>
